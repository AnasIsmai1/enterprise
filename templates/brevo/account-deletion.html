<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your account has been deleted</title>
  </head>
  <body style="margin:0; padding:0; background:#f4f5f7; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f5f7; padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px; background:#ffffff; border-radius:8px; border:1px solid #e4e6eb;">
            <tr>
              <td style="padding:32px 32px 8px 32px;">
                <p style="margin:0; font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:#6b7280;">{{ params.appName }}</p>
                <h1 style="margin:12px 0 0 0; font-size:22px; line-height:1.3; color:#111827; font-weight:600;">Your account has been deleted</h1>
              </td>
            </tr>
            <tr>
              <td style="padding:16px 32px 32px 32px;">
                <p style="margin:0 0 16px 0; font-size:15px; line-height:1.6; color:#374151;">
                  Hi {{ params.name }},
                </p>
                <p style="margin:0 0 16px 0; font-size:15px; line-height:1.6; color:#374151;">
                  Your {{ params.appName }} account and its associated data have been deleted. You will not receive further email from us.
                </p>
                <p style="margin:0; font-size:15px; line-height:1.6; color:#374151;">
                  If you did not request this, reply to this email immediately.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
