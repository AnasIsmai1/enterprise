<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Critical failure</title>
  </head>
  <body style="margin:0; padding:0; background:#f4f5f7; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f5f7; padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:640px; background:#ffffff; border-radius:8px; border:1px solid #e4e6eb;">
            <tr>
              <td style="padding:24px 32px; background:#fef2f2; border-bottom:1px solid #fecaca; border-radius:8px 8px 0 0;">
                <p style="margin:0; font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:#b91c1c;">{{ params.appName }} &middot; {{ params.environment }}</p>
                <h1 style="margin:8px 0 0 0; font-size:20px; line-height:1.3; color:#7f1d1d; font-weight:600;">Unhandled server error</h1>
              </td>
            </tr>
            <tr>
              <td style="padding:24px 32px 0 32px;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                  <tr>
                    <td style="padding:0 0 12px 0; font-size:13px; color:#6b7280; width:96px; vertical-align:top;">Message</td>
                    <td style="padding:0 0 12px 0; font-size:14px; color:#111827; font-weight:600;">{{ params.message }}</td>
                  </tr>
                  <tr>
                    <td style="padding:0 0 12px 0; font-size:13px; color:#6b7280; vertical-align:top;">Request</td>
                    <td style="padding:0 0 12px 0; font-size:14px; color:#111827; font-family:ui-monospace,SFMono-Regular,Menlo,monospace;">{{ params.path }}</td>
                  </tr>
                  <tr>
                    <td style="padding:0 0 12px 0; font-size:13px; color:#6b7280; vertical-align:top;">Time</td>
                    <td style="padding:0 0 12px 0; font-size:14px; color:#111827;">{{ params.timestamp }}</td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:12px 32px 32px 32px;">
                <p style="margin:0 0 8px 0; font-size:13px; color:#6b7280;">Stack trace</p>
                <pre style="margin:0; padding:14px 16px; background:#f9fafb; border:1px solid #e4e6eb; border-radius:6px; font-size:12px; line-height:1.5; color:#374151; white-space:pre-wrap; word-break:break-word; font-family:ui-monospace,SFMono-Regular,Menlo,monospace;">{{ params.stack }}</pre>
              </td>
            </tr>
            <tr>
              <td style="padding:20px 32px; border-top:1px solid #e4e6eb;">
                <p style="margin:0; font-size:13px; line-height:1.6; color:#6b7280;">
                  Sent by AllExceptionsFilter for 5xx responses. The same error is in Sentry with full request context.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
