# Enterprise development Docker Compose
# NOTE: Production databases must NOT be publicly accessible.
# In production, remove port bindings entirely and use internal Docker networking.
services:
  app:
    container_name: enterprise_app_dev
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
      target: dev
    env_file:
      - ../.env
    environment:
      - REDIS_HOST=redis
      - DB_HOST=postgres
      - DB_NAME=enterprise
      # Container-internal ports. The host-side bindings below are separate and
      # configurable, because a locally installed Postgres on 5432 shadows the
      # container and fails with a confusing "role does not exist" error.
      - DB_PORT=5432
      - REDIS_PORT=6379
    ports:
      - 5500:5500
    volumes:
      - ../src:/app/src
      - ../test:/app/test
      - ../package.json:/app/package.json
      - /app/node_modules
    stdin_open: true
    tty: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ../src
          target: /app/src
        - action: rebuild
          path: ../package.json
        - action: rebuild
          path: ../package-lock.json

  postgres:
    image: postgres:16
    container_name: enterprise_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: enterprise
    ports:
      # Bound to localhost only for local development (SEC-13)
      # Remove this port binding entirely in production
      - 127.0.0.1:${DB_PORT:-5433}:5432
    volumes:
      - enterprise_pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: enterprise_redis_dev
    restart: unless-stopped
    ports:
      - 127.0.0.1:${REDIS_PORT:-6379}:6379
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      [
        'redis-server',
        '--maxmemory',
        '256mb',
        '--maxmemory-policy',
        'allkeys-lru',
      ]

volumes:
  enterprise_pgdata_dev:
